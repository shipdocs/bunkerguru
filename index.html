<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunkerboot ARA – prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b2a4a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;min-width:210px;pointer-events:none}
  #hud b{color:#ffd54a}
  #msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 16px;border-radius:999px;font-size:16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #help{position:absolute;right:12px;top:215px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;pointer-events:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.7)}
  #overlay .card{background:#fff;color:#123;padding:28px 32px;border-radius:16px;max-width:460px;text-align:center}
  #overlay h1{margin:0 0 8px;font-size:26px}
  #overlay p{margin:6px 0;font-size:15px}
  #overlay button{margin-top:14px;font-size:18px;padding:10px 26px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:26px;user-select:none;-webkit-user-select:none}
  @media (pointer:coarse){#touch{display:block}#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
  <div id="help" data-nl="↑ / ↓ &nbsp;telegraaf, één stand per tik<br>← / → &nbsp;roer<br>Q / E &nbsp;boegschroef<br>Spatie &nbsp;roer midscheeps<br>T &nbsp;snelvaart 2× aan/uit<br>M &nbsp;vastmaken / losgooien<br>B &nbsp;winkel (aan terminal)<br>N &nbsp;volgende opdracht · R &nbsp;opnieuw<br>L &nbsp;English / Nederlands" data-en="↑ / ↓ &nbsp;telegraph, one notch per press<br>← / → &nbsp;rudder<br>Q / E &nbsp;bow thruster<br>Space &nbsp;rudder amidships<br>T &nbsp;fast forward 2× on/off<br>M &nbsp;moor / cast off<br>B &nbsp;shop (at terminal)<br>N &nbsp;next job · R &nbsp;restart<br>L &nbsp;English / Nederlands"></div>
  <div id="touch">
    <div class="tb" style="left:20px;bottom:90px" data-k="ArrowLeft">◀</div>
    <div class="tb" style="left:100px;bottom:90px" data-k="ArrowRight">▶</div>
    <div class="tb" style="right:20px;bottom:150px" data-k="ArrowUp">▲</div>
    <div class="tb" style="right:20px;bottom:70px" data-k="ArrowDown">▼</div>
    <div class="tb" style="left:60px;bottom:170px;width:52px;height:52px;font-size:16px" data-k="q">BS◀</div>
    <div class="tb" style="right:100px;bottom:110px;width:52px;height:52px;font-size:16px" data-k="e">BS▶</div>
    <div class="tb" style="right:100px;bottom:200px;width:52px;height:52px;font-size:18px" data-k="t">⏩</div>
    <div class="tb" style="left:20px;bottom:250px;width:52px;height:52px;font-size:18px" data-k="b">🛠️</div>
    <div class="tb" style="left:100px;bottom:170px;width:52px;height:52px;font-size:20px" data-k="m">⚓</div>
  </div>
  <div id="shop" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,20,40,.7)">
    <div class="card" style="text-align:left;background:#fff;color:#123;padding:22px 26px;border-radius:16px;width:min(560px,92vw);max-height:90vh;overflow:auto">
      <h1 style="margin:0 0 4px;font-size:24px" data-nl="🛠️ Binnenvaartwinkel" data-en="🛠️ Ship chandler">🛠️ Binnenvaartwinkel</h1>
      <div id="shopGold" style="font-weight:700;margin-bottom:10px"></div>
      <div id="shopRows"></div>
      <div style="display:flex;gap:10px;justify-content:space-between;margin-top:14px;align-items:center">
        <button id="shopReset" style="font-size:13px;padding:6px 12px;border:1px solid #c33;border-radius:999px;background:#fff;color:#c33;cursor:pointer" data-nl="Carrière wissen" data-en="Reset career">Carrière wissen</button>
        <button id="shopClose" style="font-size:16px;padding:8px 22px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer" data-nl="Terug aan boord (B)" data-en="Back on board (B)">Terug aan boord (B)</button>
      </div>
    </div>
  </div>
  <div id="overlay">
    <div class="card">
      <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px"><button class="langbtn" data-l="nl" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇳🇱 Nederlands</button><button class="langbtn" data-l="en" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇬🇧 English</button></div>
      <h1>⛴️ Bunkerboot ARA</h1>
      <div data-nl="<p>Laad bij de <b>terminal</b> van je opdracht (geel), vaar naar het zeeschip en kom netjes langszij in de <b>groene zone</b>. Zes ligplaatsen, twee terminals, Nieuwe Waterweg én Oude Maas.</p><p>Elke klus levert 🪙 goud op (vracht + tijdbonus + schadevrij). Reparatie kost goud, zinken kost de helft. In de <b>winkel</b> (B, aan een terminal) koop je motor, boegschroef, tanks, fenders en pomp. Je carrière wordt bewaard.</p><p><b>Concurrenten</b> Bunker Bert en Truus Tank werken in dezelfde haven. Gaan ze voor jouw schip, dan krijgt wie het eerst langszij ligt de klus.</p><p>Langszij: vaart eruit, koers parallel, dan <b>M</b> = trossen vast. Dan houdt de stroming je niet meer. Hard raken = schade.</p><p>Op de rivier staat 1,5 m/s stroming richting zee en er vaart verkeer. De minimap rechtsboven wijst de weg.</p>" data-en="<p>Load at the <b>terminal</b> of your job (yellow), sail to the seagoing ship and come neatly alongside in the <b>green zone</b>. Six berths, two terminals, Nieuwe Waterweg and Oude Maas.</p><p>Every job pays 🪙 gold (cargo + time bonus + damage-free). Repairs cost gold, sinking costs half of it. In the <b>shop</b> (B, at a terminal) you buy engine, bow thruster, tanks, fenders and pump. Your career is saved.</p><p><b>Rivals</b> Bunker Bert and Truus Tank work the same port. If they go for your ship, the first one alongside gets the job.</p><p>Alongside: kill the speed, heading parallel, then <b>M</b> = make fast. The current can't move you then. Hard contact = damage.</p><p>The river runs 1.5 m/s seaward and there is traffic. The minimap top right shows the way.</p>"></div>
      <button id="start" data-nl="Varen maar" data-en="Let's sail">Varen maar</button>
    </div>
  </div>
</div>
<script>
(() => {
// ---------- taal ----------
let lang = 'nl'; try { lang = localStorage.getItem('bunker_lang') || ((navigator.language || 'nl').toLowerCase().startsWith('nl') ? 'nl' : 'en'); } catch (e) {}
const EN = {
  'Opdracht {0}: {1} t voor {2} ({3}). Laden bij {4}.': 'Job {0}: {1} t for {2} ({3}). Load at {4}.',
  '📻 {0}: "Ik ga ook voor {1}!" – wie het eerst langszij ligt krijgt de klus': '📻 {0}: "I\'m going for {1} too!" – first one alongside gets the job',
  '❌ {0} lag eerder langszij {1}. Klus verloren! Nieuwe opdracht…': '❌ {0} got alongside {1} first. Job lost! New job…',
  'Trossen los': 'Lines cast off',
  'Kan niet vastmaken: {0}': 'Cannot moor: {0}',
  'te veel vaart ({0} km/h)': 'too much speed ({0} km/h)',
  'koers {0}° scheef': 'heading {0}° off',
  'niet bij een ligplaats of terminal': 'not at a berth or terminal',
  '⚓ Vast langszij. Slangen aan!': '⚓ Moored alongside. Hoses on!',
  '⚓ Vast aan de terminal': '⚓ Moored at the terminal',
  '⚓ Trossen zitten vast – eerst M = los': '⚓ Lines are fast – press M to cast off first',
  '⏩ Snelvaart 2× (T = uit)': '⏩ Fast forward 2× (T = off)', 'Normale tijd': 'Normal time', 'Snelvaart uit': 'Fast forward off',
  '💥 Raak! +{0} schade': '💥 Hit! +{0} damage',
  '🫧 Gezonken! Verzekering betaalt de helft: −{0} goud. Nieuwe boot volgt…': '🫧 Sunk! Insurance covers half: −{0} gold. New boat on its way…',
  '{0}Laden… {1} / {2} t{3} · {4} · B = winkel': '{0}Loading… {1} / {2} t{3} · {4} · B = shop',
  ' · werf repareert (2 🪙/pt)': ' · yard repairing (2 🪙/pt)', 'M = los': 'M = cast off', 'M = vast': 'M = moor',
  'Vol. Naar {0}, {1}. Let op stroming, dam en verkeer!': 'Full. Head for {0}, {1}. Mind the current, the dam and traffic!',
  'Haal {0} t bij {1} (geel) – stil liggen om te laden': 'Collect {0} t at {1} (yellow) – lie still to load',
  'Slangen aan. Bunkeren!': 'Hoses on. Bunkering!',
  'Langszij… houden {0} s': 'Alongside… hold {0} s',
  'Te snel: {0} km/h': 'Too fast: {0} km/h', 'Koers {0}° scheef': 'Heading {0}° off', 'M = trossen vast': 'M = make fast',
  'Naar de groene zone langs het zeeschip (zie minimap)': 'Go to the green zone alongside the ship (see minimap)',
  '⚠️ Losgeslagen! Slangen eraf. Opnieuw langszij (of M = vast).': '⚠️ Broke loose! Hoses off. Get alongside again (or M = moor).',
  'Bunkeren… {0} t aan boord': 'Bunkering… {0} t on board',
  '✅ Klaar!{0} 🪙 +{1} vracht +{2} tijd{3} = {4} goud. N = volgende, B = winkel': '✅ Done!{0} 🪙 +{1} cargo +{2} time{3} = {4} gold. N = next, B = shop',
  ' M = los,': ' M = cast off,', ' +150 schadevrij': ' +150 damage-free',
  'Winkel alleen aan een terminal (stil liggen) of na een klus': 'Shop only at a terminal (lying still) or after a job',
  '🪙 {0} goud · {1} klussen gedaan': '🪙 {0} gold · {1} jobs done', 'Koop 🪙 {0}': 'Buy 🪙 {0}', 'niveau {0}/{1}': 'level {0}/{1}', 'Volgende: {0}': 'Next: {0}',
  'Carrière wissen': 'Reset career', 'Zeker? Klik nogmaals': 'Sure? Click again', 'Terug aan boord (B)': 'Back on board (B)', '🛠️ Binnenvaartwinkel': '🛠️ Ship chandler',
  'Koers {0}° {1}': 'Heading {0}° {1}', '→ draai BB': '→ turn to port', '→ draai SB': '→ turn to starboard', 'Vaart {0} km/h {1}': 'Speed {0} km/h {1}', '✓  →  M = vast': '✓  →  M = moor', '→ afremmen': '→ slow down',
  'ROER': 'RUDDER', 'TELEGRAAF': 'TELEGRAPH', 'BB ': 'PT ', 'SB ': 'SB ',
  '⚓ AFGEMEERD (M = los)': '⚓ MOORED (M = cast off)', '⏩ SNELVAART 2×': '⏩ FAST FORWARD 2×',
  'Goud': 'Gold', 'klussen': 'jobs', 'Opdracht': 'Job', 'Totaal': 'Total', 'Vaart': 'Speed', 'Koers': 'Heading', 'Telegraaf': 'Telegraph', 'Roer': 'Rudder', 'Stroom': 'Current', 'Lading': 'Cargo', 'Schade': 'Damage', 'Tijd': 'Time', 'Beste score': 'Best score',
  'midscheeps': 'amidships', 'bakboord ': 'port ', 'stuurboord ': 'starboard ',
  'vol achteruit': 'full astern', 'half achteruit': 'half astern', 'langzaam achteruit': 'slow astern', 'stop': 'stop', 'zeer langzaam': 'dead slow', 'langzaam': 'slow', 'half': 'half', 'vol': 'full', 'vol vooruit': 'full ahead',
  '← NIEUWE WATERWEG · stroom 1,5 m/s naar zee': '← NIEUWE WATERWEG · current 1.5 m/s seaward',
  'noordoever bij Maassluis': 'north bank near Maassluis', 'Perniskade aan de rivier': 'Pernis quay on the river', 'westwand Geulhaven': 'west wall of Geulhaven', 'Europoortkade, ver stroomafwaarts': 'Europoort quay, far downstream', 'Haven Maassluis (noordoever)': 'Maassluis harbour (north bank)', 'westwand Oude Maas': 'west wall of the Oude Maas',
  'Motor': 'Engine', 'Boegschroef': 'Bow thruster', 'Tanks': 'Tanks', 'Fenders': 'Fenders', 'Pomp': 'Pump',
  'Standaard 1200 pk (31 km/h)': 'Standard 1200 hp (31 km/h)', 'Zwaardere motor: 38 km/h': 'Heavier engine: 38 km/h', 'Racemotor: 46 km/h': 'Racing engine: 46 km/h',
  'Standaard': 'Standard', 'Dubbele boegschroef (+60 %)': 'Twin bow thruster (+60 %)', 'Kanaalschroef (+130 %)': 'Tunnel thruster (+130 %)',
  '1200 t': '1200 t', '1600 t: grotere klussen': '1600 t: bigger jobs', '2000 t: de grote jongens': '2000 t: the big boys',
  'Dikke fenders: schade −30 %': 'Thick fenders: damage −30 %', 'Stootkussens: schade −55 %': 'Yokohama fenders: damage −55 %',
  'Bunkeren 6 s': 'Bunkering 6 s', 'Snelle pomp: 4 s': 'Fast pump: 4 s', 'Turbo-pomp: 2,5 s': 'Turbo pump: 2.5 s',
  'HIER': 'HERE',
};
function tr(s) { return lang === 'en' && EN[s] !== undefined ? EN[s] : s; }
function tf(s, ...a) { return tr(s).replace(/\{(\d+)\}/g, (m, i) => a[+i]); }
function setLang(l) { lang = l; try { localStorage.setItem('bunker_lang', l); } catch (e) {} applyLangHTML(); }
function applyLangHTML() {
  document.querySelectorAll('[data-nl]').forEach(el => { el.innerHTML = lang === 'en' ? el.dataset.en : el.dataset.nl; });
  document.querySelectorAll('.langbtn').forEach(b => b.style.opacity = b.dataset.l === lang ? 1 : 0.45);
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), msgEl = document.getElementById('msg');
const overlay = document.getElementById('overlay');
let VW = innerWidth, VH = innerHeight;
function fit() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', fit); fit();

// ---------- wereld ----------
// px-coördinaten; 1 px = 0,5 m. Rivierframe (s,n): s langs de rivier (zee = s klein), n dwars (n>0 = zuidoever/Botlek)
const SCALE = 2, toPx = m => m * SCALE, TIME = 3;
const TH = Math.atan2(1000, 2400), CT = Math.cos(TH), ST = Math.sin(TH);
const ORG = { x: 0, y: 330 };
const sn2w = (s, n) => ({ x: ORG.x + s * CT - n * ST, y: ORG.y + s * ST + n * CT });
const w2sn = (x, y) => { const dx = x - ORG.x, dy = y - ORG.y; return { s: dx * CT + dy * ST, n: -dx * ST + dy * CT }; };
const W = 4300, H = 2750;
const RIVER_HALF = 160; // halve rivierbreedte in px (160 m breed)

function quad(s0, s1, n0, n1) { return [sn2w(s0, n0), sn2w(s1, n0), sn2w(s1, n1), sn2w(s0, n1)]; }
// land als convexe vierhoeken
const S_MAX = 5200, CH0 = 2900, CH1 = 3150; // Oude Maas-tak tussen CH0 en CH1
const land = [
  { poly: quad(-800, 2500, -RIVER_HALF, -500), kind: 'north' },             // noordoever west
  { poly: quad(2620, S_MAX, -RIVER_HALF, -500), kind: 'north' },            // noordoever oost (Maassluis)
  { poly: quad(-800, S_MAX, -500, -2200), kind: 'north' },                  // noord achterland
  { poly: quad(-800, 520, RIVER_HALF, 720), kind: 'tanks', label: 'Europoort' },
  { poly: quad(720, 1120, RIVER_HALF, 720), kind: 'containers', label: 'Botlek' },
  { poly: quad(1280, 1720, RIVER_HALF, 720), kind: 'tanks', label: 'Pernis' },
  { poly: quad(1900, CH0, RIVER_HALF, 720), kind: 'town2', label: 'Vondelingenplaat' },
  { poly: quad(CH1, S_MAX, RIVER_HALF, 720), kind: 'tanks', label: 'Hoogvliet' },
  { poly: quad(-800, CH0, 720, 2600), kind: 'base' },
  { poly: quad(CH1, S_MAX, 720, 2600), kind: 'base' },
  { poly: quad(1450, 1950, -92, -72), kind: 'dam', label: 'Dam' },
];
const northBasin = { s0: 2500, s1: 2620, n0: -500, n1: -RIVER_HALF, name: 'Haven Maassluis' };
// oeverranden: randen die niet aan ander land grenzen
const shore = [];
land.forEach((l, li) => { const P = l.poly; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; const len = Math.hypot(q.x - p.x, q.y - p.y); let nx = (q.y - p.y) / len, ny = -(q.x - p.x) / len; const mid = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 }; if (inPoly({ x: mid.x + nx * 6, y: mid.y + ny * 6 }, P)) { nx = -nx; ny = -ny; } const out = { x: mid.x + nx * 8, y: mid.y + ny * 8 }; if (!land.some((o, oi) => oi !== li && inPoly(out, o.poly))) shore.push({ p, q, nx, ny, li }); } });
const basins = [
  { s0: 520, s1: 720, n0: RIVER_HALF, n1: 720, name: '1e Petroleumhaven' },
  { s0: 1120, s1: 1280, n0: RIVER_HALF, n1: 720, name: '2e Petroleumhaven' },
  { s0: 1720, s1: 1900, n0: RIVER_HALF, n1: 720, name: 'Geulhaven' },
  { s0: CH0, s1: CH1, n0: RIVER_HALF, n1: 2600, name: 'Oude Maas' },
];
// terminals (s,n)
const terminals = [
  { s0: 540, s1: 700, n0: 620, n1: 720, name: 'Terminal Botlek' },
  { s0: CH1 - 110, s1: CH1 - 10, n0: 1150, n1: 1400, name: 'Terminal Oude Maas' },
];
let terminal = terminals[0];
// ligplaatsen: afgemeerde zeeschepen. axis 's' = langs rivier, 'n' = langs bekkenwand. side = kant waar het water is (+1 = grotere coördinaat)
const berths = [
  { name: 'MV CARTOON STAR', col: '#e74c3c', axis: 's', a0: 2050, a1: 2330, c: -RIVER_HALF + 28, side: +1, where: 'noordoever bij Maassluis' },
  { name: 'MT OLIEBOL', col: '#2c7fb8', axis: 's', a0: 1320, a1: 1600, c: RIVER_HALF - 28, side: -1, where: 'Perniskade aan de rivier' },
  { name: 'MV KAASKOP', col: '#8e44ad', axis: 'n', a0: 300, a1: 560, c: 1720 + 28, side: +1, where: 'westwand Geulhaven' },
  { name: 'MV EUROPOORT', col: '#27ae60', axis: 's', a0: -300, a1: -20, c: RIVER_HALF - 28, side: -1, where: 'Europoortkade, ver stroomafwaarts' },
  { name: 'MT MAASSLUIS', col: '#c0392b', axis: 'n', a0: -460, a1: -220, c: 2500 + 28, side: +1, where: 'Haven Maassluis (noordoever)' },
  { name: 'MV OUDE MAAS', col: '#f39c12', axis: 'n', a0: 700, a1: 980, c: CH0 + 28, side: +1, where: 'westwand Oude Maas' },
];
const SH = 52;
for (const b of berths) {
  b.quad = b.axis === 's' ? quad(b.a0, b.a1, b.c - SH / 2, b.c + SH / 2) : quad(b.c - SH / 2, b.c + SH / 2, b.a0, b.a1);
  const d0 = b.c + b.side * (SH / 2 + 2), d1 = b.c + b.side * (SH / 2 + 44);
  b.dock = b.axis === 's' ? { s0: b.a0 - 10, s1: b.a1 + 10, n0: Math.min(d0, d1), n1: Math.max(d0, d1) } : { s0: Math.min(d0, d1), s1: Math.max(d0, d1), n0: b.a0 - 10, n1: b.a1 + 10 };
  b.hdg = b.axis === 's' ? TH : TH + Math.PI / 2;
  const mid = b.axis === 's' ? sn2w((b.a0 + b.a1) / 2, b.c) : sn2w(b.c, (b.a0 + b.a1) / 2);
  b.cx = mid.x; b.cy = mid.y; b.len = b.a1 - b.a0;
}
let mission = 0, missionCount = 0;
let ship = berths[0], dock = ship.dock;
// varend verkeer op de rivier
const traffic = [
  { name: 'MV TRAAG', col: '#16a085', s: 3200, n: -25, v: -4.0, len: 300 },  // afvarend (naar zee)
  { name: 'MT HAAST', col: '#d35400', s: -400, n: 30, v: 3.2, len: 240 },     // opvarend
  { name: 'MV DRUK', col: '#7f8c8d', s: 1200, n: -25, v: -3.0, len: 200 },   // tweede afvaarder
  { name: 'SLB BUTS', col: '#2c3e50', s: CH0 + 60, n: 2400, v: -5.0, len: 90, axis: 'n' }, // sleepboot in de Oude Maas
];
for (const tr of traffic) { tr.hdg = tr.axis === 'n' ? (tr.v > 0 ? TH + Math.PI / 2 : TH - Math.PI / 2) : (tr.v > 0 ? TH : TH + Math.PI); }
function updateTraffic(dt) {
  for (const tr of traffic) {
    if (tr.axis === 'n') {
      tr.n += toPx(tr.v) * dt * TIME;
      if (tr.n < RIVER_HALF + 80) { tr.v = Math.abs(tr.v); tr.hdg = TH + Math.PI / 2; } if (tr.n > 2500) { tr.v = -Math.abs(tr.v); tr.hdg = TH - Math.PI / 2; }
      tr.quad = quad(tr.s - SH / 2, tr.s + SH / 2, tr.n - tr.len / 2, tr.n + tr.len / 2);
    } else {
      tr.s += toPx(tr.v) * dt * TIME;
      if (tr.v < 0 && tr.s < -800) tr.s = S_MAX; if (tr.v > 0 && tr.s > S_MAX) tr.s = -800;
