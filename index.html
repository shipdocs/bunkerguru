<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunkerguru – bunkerboot ARA</title>
<style>
  html,body{margin:0;height:100%;background:#0b2a4a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none}
  #wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;min-width:210px;pointer-events:none}
  #hud b{color:#ffd54a}
  #msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 16px;border-radius:999px;font-size:16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #help{position:absolute;right:12px;top:215px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;pointer-events:none}
  #radio{position:absolute;left:12px;bottom:110px;max-width:min(420px,60vw);background:rgba(20,30,20,.85);border:2px solid #5ee88a;color:#d8ffe0;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px 12px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .4s}
  #radio b{color:#5ee88a}
  .srow{display:grid;grid-template-columns:170px 1fr 36px;align-items:center;gap:8px;margin:8px 0}
  .srow input[type=range]{width:100%}
  .srow span[id^=t_]{text-align:right;font-size:13px;color:#555}
  #sndBtn{position:absolute;right:12px;bottom:200px;background:rgba(0,0,0,.45);border:0;color:#fff;font-size:20px;border-radius:10px;padding:6px 10px;cursor:pointer}
  body.bigmap #help,body.bigmap #radio,body.bigmap #sndBtn{display:none}
  body.bigmap #hud{opacity:.35}
  body.bigmap .tb.col{display:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.7)}
  #overlay .card{background:#fff;color:#123;padding:28px 32px;border-radius:16px;max-width:460px;text-align:center}
  #overlay h1{margin:0 0 8px;font-size:26px}
  #overlay p{margin:6px 0;font-size:15px}
  #overlay button{margin-top:14px;font-size:18px;padding:10px 26px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:26px;user-select:none;-webkit-user-select:none}
  .mapcard{flex:1 1 180px;max-width:220px;background:#f7f7f7;border-radius:12px;padding:10px;cursor:pointer;text-align:center}
  .mapcard:hover{background:#eee}
  #overlay .card{max-width:560px}
  @media (pointer:coarse){#touch{display:block}#help{display:none}}
  .tb{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
  #touch{padding-bottom:env(safe-area-inset-bottom)}
  .tb.m{width:52px;height:52px;font-size:16px}
  .tb.s{width:44px;height:44px;font-size:18px}
  .tb.col{right:10px}
  #overlay,#shop,#sound{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .startbar{position:sticky;bottom:-28px;background:#fff;padding:10px 0 4px;margin-top:6px}
  details.rules summary{cursor:pointer;font-weight:700;margin:6px 0;color:#2980b9}
  /* compacte indeling: telefoon / klein scherm */
  body.compact #hud{top:54px;left:6px;font-size:11px;line-height:1.35;padding:6px 9px;min-width:0;max-width:calc(100vw - 170px)}
  body.compact #msg{top:6px;left:6px;right:6px;transform:none;white-space:normal;font-size:12px;line-height:1.3;padding:6px 12px;border-radius:10px;text-align:center;max-width:none}
  body.compact #radio{left:8px;right:70px;bottom:170px;max-width:none;font-size:11px;padding:6px 9px}
  body.compact #sndBtn{display:none}
  body.compact #overlay{align-items:flex-start;padding:10px 0}
  body.compact #overlay .card{padding:16px 16px 0;margin:0 8px;font-size:14px}
  body.compact #overlay h1{font-size:22px}
  body.compact #overlay p{font-size:13px;margin:4px 0}
  body.compact .mapcard{flex:1 1 40%;padding:8px;font-size:13px}
  body.compact .mapcard div:first-child{font-size:24px!important}
  body.compact .mapcard div:last-child{font-size:11px!important}
  body.compact #shop,body.compact #sound{align-items:flex-start;padding:10px 0}
  @media (max-height:500px){ /* telefoon liggend: kleine knoppen als rij naast de minimap */
    .tb.col{right:auto;left:auto}
    .tb.col[data-k="b"]{top:56px!important;right:164px} .tb.col[data-k="esc"]{top:56px!important;right:214px}
    .tb.col[data-k="o"]{top:56px!important;right:264px} .tb.col[data-k="h"]{top:56px!important;right:314px}
    body.compact #hud{max-width:calc(100vw - 380px)}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
  <div id="radio"></div>
  <button id="sndBtn" title="Geluid / Sound (O)">🔊</button>
  <div id="help" data-nl="↑ / ↓ &nbsp;telegraaf, één stand per tik<br>← / → &nbsp;roer<br>Q / E &nbsp;boegschroef<br>Spatie &nbsp;roer midscheeps<br>T &nbsp;snelvaart 2× aan/uit<br>M &nbsp;vastmaken / losgooien (blauwe P = wachtplaats: opslaan + rusten)<br>B &nbsp;winkel (aan terminal)<br>N &nbsp;volgende opdracht · R &nbsp;opnieuw<br>L &nbsp;English / Nederlands · Esc &nbsp;kaartmenu<br>+ / − / scrollwiel &nbsp;zoom · 0 &nbsp;reset · K &nbsp;grote kaart<br>H &nbsp;scheepshoorn · O &nbsp;geluidsinstellingen<br>G &nbsp;geluid · P &nbsp;muziek · V &nbsp;marifoon (aan/uit)" data-en="↑ / ↓ &nbsp;telegraph, one notch per press<br>← / → &nbsp;rudder<br>Q / E &nbsp;bow thruster<br>Space &nbsp;rudder amidships<br>T &nbsp;fast forward 2× on/off<br>M &nbsp;moor / cast off (blue P = waiting berth: save + rest)<br>B &nbsp;shop (at terminal)<br>N &nbsp;next job · R &nbsp;restart<br>L &nbsp;English / Nederlands · Esc &nbsp;map menu<br>+ / − / mouse wheel &nbsp;zoom · 0 &nbsp;reset · K &nbsp;big map<br>H &nbsp;horn · O &nbsp;sound settings<br>G &nbsp;sound · P &nbsp;music · V &nbsp;VHF (on/off)"></div>
  <div id="touch">
    <div class="tb" style="left:12px;bottom:16px" data-k="ArrowLeft">◀</div>
    <div class="tb" style="left:84px;bottom:16px" data-k="ArrowRight">▶</div>
    <div class="tb m" style="left:12px;bottom:92px" data-k="q">BS◀</div>
    <div class="tb m" style="left:96px;bottom:92px" data-k="e">BS▶</div>
    <div class="tb" style="right:12px;bottom:16px" data-k="ArrowDown">▼</div>
    <div class="tb" style="right:12px;bottom:92px" data-k="ArrowUp">▲</div>
    <div class="tb m" style="right:86px;bottom:20px;font-size:22px" data-k="m">⚓</div>
    <div class="tb s" style="right:92px;bottom:88px" data-k="t">⏩</div>
    <div class="tb" style="left:50%;transform:translateX(-50%);bottom:2px;width:96px;height:58px;border-radius:14px;background:transparent;border:0" data-k="mid"></div>
    <div class="tb s col" style="top:180px" data-k="b">🛠️</div>
    <div class="tb s col" style="top:230px" data-k="esc">🗺️</div>
    <div class="tb s col" style="top:280px" data-k="o">🔊</div>
    <div class="tb s col" style="top:330px" data-k="h">📯</div>
  </div>
  <div id="sound" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,20,40,.6);z-index:20">
    <div style="background:#fff;color:#123;padding:20px 24px;border-radius:16px;width:min(420px,92vw);text-align:left">
      <h2 style="margin:0 0 10px;font-size:20px" data-nl="🔊 Geluid" data-en="🔊 Sound">🔊 Geluid</h2>
      <div class="srow"><label><input type="checkbox" id="s_on"> <b data-nl="Geluid" data-en="Sound">Geluid</b></label><input type="range" id="v_master" min="0" max="100"><span id="t_master"></span></div>
      <div class="srow"><label><input type="checkbox" checked disabled style="visibility:hidden"> <span data-nl="Motor &amp; effecten" data-en="Engine &amp; effects">Motor &amp; effecten</span></label><input type="range" id="v_sfx" min="0" max="100"><span id="t_sfx"></span></div>
      <div class="srow"><label><input type="checkbox" id="s_music"> <span data-nl="Muziek" data-en="Music">Muziek</span></label><input type="range" id="v_music" min="0" max="100"><span id="t_music"></span></div>
      <div class="srow"><label><input type="checkbox" id="s_radio"> <span data-nl="Marifoon" data-en="VHF radio">Marifoon</span></label><input type="range" id="v_radio" min="0" max="100"><span id="t_radio"></span></div>
      <div class="srow"><span style="padding-left:24px" data-nl="Marifoonstem" data-en="VHF voice">Marifoonstem</span><select id="s_rmode" style="font-size:13px;padding:3px"><option value="auto" data-nl="Automatisch" data-en="Automatic">Automatisch</option><option value="speech" data-nl="Echte spraak" data-en="Real speech">Echte spraak</option><option value="babble" data-nl="Radio-gebrabbel" data-en="Radio babble">Radio-gebrabbel</option></select><button id="s_rtest" style="font-size:12px;padding:3px 6px;border:1px solid #999;border-radius:6px;background:#fff;cursor:pointer">▶</button></div>
      <div id="s_rstatus" style="font-size:11px;color:#666;margin:-2px 0 4px 24px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span style="font-size:12px;color:#666" data-nl="O = dit venster · G / P / V = snel aan/uit" data-en="O = this panel · G / P / V = quick toggles">O = dit venster · G / P / V = snel aan/uit</span>
        <button id="soundClose" style="font-size:15px;padding:7px 18px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer">OK</button>
      </div>
    </div>
  </div>
  <div id="shop" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,20,40,.7)">
    <div class="card" style="text-align:left;background:#fff;color:#123;padding:22px 26px;border-radius:16px;width:min(560px,92vw);max-height:90vh;overflow:auto">
      <h1 style="margin:0 0 4px;font-size:24px" data-nl="🛠️ Binnenvaartwinkel" data-en="🛠️ Ship chandler">🛠️ Binnenvaartwinkel</h1>
      <div id="shopGold" style="font-weight:700;margin-bottom:10px"></div>
      <div id="shopRows"></div>
      <div style="display:flex;gap:10px;justify-content:space-between;margin-top:14px;align-items:center">
        <button id="shopReset" style="font-size:13px;padding:6px 12px;border:1px solid #c33;border-radius:999px;background:#fff;color:#c33;cursor:pointer" data-nl="Carrière wissen" data-en="Reset career">Carrière wissen</button>
        <button id="shopClose" style="font-size:16px;padding:8px 22px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer" data-nl="Terug aan boord (B)" data-en="Back on board (B)">Terug aan boord (B)</button>
      </div>
    </div>
  </div>
  <div id="overlay">
    <div class="card">
      <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px"><button class="langbtn" data-l="nl" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇳🇱 Nederlands</button><button class="langbtn" data-l="en" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇬🇧 English</button></div>
      <h1>⛴️ Bunkerguru</h1>
      <div id="mapList" style="display:flex;gap:10px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap"></div>
      <details class="rules" id="rules"><summary data-nl="📖 Uitleg" data-en="📖 How to play">📖 Uitleg</summary>
      <div data-nl="<p>Laad bij de <b>terminal</b> van je opdracht (geel), vaar naar het zeeschip en kom netjes langszij in de <b>groene zone</b>. Zes ligplaatsen, twee terminals, Nieuwe Waterweg én Oude Maas.</p><p>Elke klus levert 🪙 goud op (vracht + tijdbonus + schadevrij). Reparatie kost goud, zinken kost de helft. In de <b>winkel</b> (B, aan een terminal) koop je motor, boegschroef, tanks, fenders en pomp. Je carrière wordt bewaard.</p><p><b>Concurrenten</b> Bunker Bert en Truus Tank werken in dezelfde haven. Gaan ze voor jouw schip, dan krijgt wie het eerst langszij ligt de klus.</p><p>Langszij: vaart eruit, koers parallel, dan <b>M</b> = trossen vast. Dan houdt de stroming je niet meer. Hard raken = schade.</p><p>Het is een getijdengebied: eb tot 4 m/s naar zee, vloed landinwaarts, en het verkeer vaart gewoon door. De minimap rechtsboven wijst de weg.</p>" data-en="<p>Load at the <b>terminal</b> of your job (yellow), sail to the seagoing ship and come neatly alongside in the <b>green zone</b>. Six berths, two terminals, Nieuwe Waterweg and Oude Maas.</p><p>Every job pays 🪙 gold (cargo + time bonus + damage-free). Repairs cost gold, sinking costs half of it. In the <b>shop</b> (B, at a terminal) you buy engine, bow thruster, tanks, fenders and pump. Your career is saved.</p><p><b>Rivals</b> Bunker Bert and Truus Tank work the same port. If they go for your ship, the first one alongside gets the job.</p><p>Alongside: kill the speed, heading parallel, then <b>M</b> = make fast. The current can't move you then. Hard contact = damage.</p><p>It's tidal: ebb up to 4 m/s seaward, flood running inland, and the traffic keeps moving. The minimap top right shows the way.</p>"></div>
      </details>
      <div class="startbar"><button id="cont" style="display:none;font-size:15px;padding:8px 18px;border:0;border-radius:14px;background:#2980b9;color:#fff;font-weight:700;cursor:pointer;margin-right:6px;line-height:1.2"></button><button id="soundBtn2" style="font-size:14px;padding:6px 14px;border:1px solid #999;border-radius:999px;background:#fff;color:#123;cursor:pointer;margin-right:6px" data-nl="🔊 Geluid" data-en="🔊 Sound">🔊 Geluid</button>
      <button id="start" data-nl="Varen maar" data-en="Let's sail">Varen maar</button></div>
    </div>
  </div>
</div>
<script src="maps/europoort.js?v=202611071100"></script>
<script src="maps/rotterdam.js?v=202611071100"></script>
<script src="maps/amsterdam.js?v=202611071100"></script>
<script src="maps/antwerpen.js?v=202611071100"></script>
<script src="radio.js?v=202611071100"></script>
<script src="audio.js?v=202611071100"></script>
<script src="engine.js?v=202611071100"></script>
</body>
</html>
