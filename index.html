<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunkerguru – bunkerboot ARA</title>
<style>
  html,body{margin:0;height:100%;background:#0b2a4a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none}
  #wrap{position:relative;width:100vw;height:100vh}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;min-width:210px;pointer-events:none}
  #hud b{color:#ffd54a}
  #msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 16px;border-radius:999px;font-size:16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #help{position:absolute;right:12px;top:215px;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;pointer-events:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.7)}
  #overlay .card{background:#fff;color:#123;padding:28px 32px;border-radius:16px;max-width:460px;text-align:center}
  #overlay h1{margin:0 0 8px;font-size:26px}
  #overlay p{margin:6px 0;font-size:15px}
  #overlay button{margin-top:14px;font-size:18px;padding:10px 26px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:26px;user-select:none;-webkit-user-select:none}
  .mapcard{flex:1 1 180px;max-width:220px;background:#f7f7f7;border-radius:12px;padding:10px;cursor:pointer;text-align:center}
  .mapcard:hover{background:#eee}
  #overlay .card{max-width:560px}
  @media (pointer:coarse){#touch{display:block}#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
  <div id="help" data-nl="↑ / ↓ &nbsp;telegraaf, één stand per tik<br>← / → &nbsp;roer<br>Q / E &nbsp;boegschroef<br>Spatie &nbsp;roer midscheeps<br>T &nbsp;snelvaart 2× aan/uit<br>M &nbsp;vastmaken / losgooien<br>B &nbsp;winkel (aan terminal)<br>N &nbsp;volgende opdracht · R &nbsp;opnieuw<br>L &nbsp;English / Nederlands · Esc &nbsp;kaartmenu" data-en="↑ / ↓ &nbsp;telegraph, one notch per press<br>← / → &nbsp;rudder<br>Q / E &nbsp;bow thruster<br>Space &nbsp;rudder amidships<br>T &nbsp;fast forward 2× on/off<br>M &nbsp;moor / cast off<br>B &nbsp;shop (at terminal)<br>N &nbsp;next job · R &nbsp;restart<br>L &nbsp;English / Nederlands · Esc &nbsp;map menu"></div>
  <div id="touch">
    <div class="tb" style="left:20px;bottom:90px" data-k="ArrowLeft">◀</div>
    <div class="tb" style="left:100px;bottom:90px" data-k="ArrowRight">▶</div>
    <div class="tb" style="right:20px;bottom:150px" data-k="ArrowUp">▲</div>
    <div class="tb" style="right:20px;bottom:70px" data-k="ArrowDown">▼</div>
    <div class="tb" style="left:60px;bottom:170px;width:52px;height:52px;font-size:16px" data-k="q">BS◀</div>
    <div class="tb" style="right:100px;bottom:110px;width:52px;height:52px;font-size:16px" data-k="e">BS▶</div>
    <div class="tb" style="right:100px;bottom:200px;width:52px;height:52px;font-size:18px" data-k="t">⏩</div>
    <div class="tb" style="left:20px;bottom:250px;width:52px;height:52px;font-size:18px" data-k="b">🛠️</div>
    <div class="tb" style="left:100px;bottom:170px;width:52px;height:52px;font-size:20px" data-k="m">⚓</div>
    <div class="tb" style="left:100px;bottom:250px;width:52px;height:52px;font-size:20px" data-k="esc">🗺️</div>
  </div>
  <div id="shop" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,20,40,.7)">
    <div class="card" style="text-align:left;background:#fff;color:#123;padding:22px 26px;border-radius:16px;width:min(560px,92vw);max-height:90vh;overflow:auto">
      <h1 style="margin:0 0 4px;font-size:24px" data-nl="🛠️ Binnenvaartwinkel" data-en="🛠️ Ship chandler">🛠️ Binnenvaartwinkel</h1>
      <div id="shopGold" style="font-weight:700;margin-bottom:10px"></div>
      <div id="shopRows"></div>
      <div style="display:flex;gap:10px;justify-content:space-between;margin-top:14px;align-items:center">
        <button id="shopReset" style="font-size:13px;padding:6px 12px;border:1px solid #c33;border-radius:999px;background:#fff;color:#c33;cursor:pointer" data-nl="Carrière wissen" data-en="Reset career">Carrière wissen</button>
        <button id="shopClose" style="font-size:16px;padding:8px 22px;border:0;border-radius:999px;background:#ff8a2a;color:#fff;font-weight:700;cursor:pointer" data-nl="Terug aan boord (B)" data-en="Back on board (B)">Terug aan boord (B)</button>
      </div>
    </div>
  </div>
  <div id="overlay">
    <div class="card">
      <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px"><button class="langbtn" data-l="nl" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇳🇱 Nederlands</button><button class="langbtn" data-l="en" style="font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #999;background:#fff;color:#123;cursor:pointer">🇬🇧 English</button></div>
      <h1>⛴️ Bunkerguru</h1>
      <div id="mapList" style="display:flex;gap:10px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap"></div>
      <div data-nl="<p>Laad bij de <b>terminal</b> van je opdracht (geel), vaar naar het zeeschip en kom netjes langszij in de <b>groene zone</b>. Zes ligplaatsen, twee terminals, Nieuwe Waterweg én Oude Maas.</p><p>Elke klus levert 🪙 goud op (vracht + tijdbonus + schadevrij). Reparatie kost goud, zinken kost de helft. In de <b>winkel</b> (B, aan een terminal) koop je motor, boegschroef, tanks, fenders en pomp. Je carrière wordt bewaard.</p><p><b>Concurrenten</b> Bunker Bert en Truus Tank werken in dezelfde haven. Gaan ze voor jouw schip, dan krijgt wie het eerst langszij ligt de klus.</p><p>Langszij: vaart eruit, koers parallel, dan <b>M</b> = trossen vast. Dan houdt de stroming je niet meer. Hard raken = schade.</p><p>Op de rivier staat 1,5 m/s stroming richting zee en er vaart verkeer. De minimap rechtsboven wijst de weg.</p>" data-en="<p>Load at the <b>terminal</b> of your job (yellow), sail to the seagoing ship and come neatly alongside in the <b>green zone</b>. Six berths, two terminals, Nieuwe Waterweg and Oude Maas.</p><p>Every job pays 🪙 gold (cargo + time bonus + damage-free). Repairs cost gold, sinking costs half of it. In the <b>shop</b> (B, at a terminal) you buy engine, bow thruster, tanks, fenders and pump. Your career is saved.</p><p><b>Rivals</b> Bunker Bert and Truus Tank work the same port. If they go for your ship, the first one alongside gets the job.</p><p>Alongside: kill the speed, heading parallel, then <b>M</b> = make fast. The current can't move you then. Hard contact = damage.</p><p>The river runs 1.5 m/s seaward and there is traffic. The minimap top right shows the way.</p>"></div>
      <button id="start" data-nl="Varen maar" data-en="Let's sail">Varen maar</button>
    </div>
  </div>
</div>
<script src="maps/europoort.js"></script>
<script src="maps/rotterdam.js"></script>
<script src="engine.js"></script>
</body>
</html>
